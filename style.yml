---
- name: Configure HP Omen Max 16 on Fedora
  hosts: omen
  become: true
  gather_facts: true

  vars:
    target_user: "{{ ansible_user_id }}"

  tasks:
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true

    - name: Install base packages
      ansible.builtin.dnf:
        name:
          - dnf-plugins-core
          - wget
          - curl
          - git
          - neovim
          - htop
          - pciutils
          - usbutils
          - gcc
          - gcc-c++
          - make
          - cmake
          - kernel-headers
          - kernel-devel
          - dkms
          - python3-pip
          - python3-virtualenv
          - uv
          - podman
          - podman-docker
        state: present

    - name: Check whether RPM Fusion free repo is already installed
      ansible.builtin.command: rpm -q rpmfusion-free-release
      register: rpmfusion_free_check
      changed_when: false
      failed_when: false

    - name: Bootstrap RPM Fusion free and nonfree with nogpgcheck
      ansible.builtin.command: >
        dnf install -y --nogpgcheck
        https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
        https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
      args:
        executable: /bin/bash
      when: rpmfusion_free_check.rc != 0

    - name: Refresh metadata after enabling RPM Fusion
      ansible.builtin.dnf:
        update_cache: true

    - name: Install NVIDIA open driver stack
      ansible.builtin.dnf:
        name:
          - akmod-nvidia-open
          - xorg-x11-drv-nvidia
          - xorg-x11-drv-nvidia-cuda
          - nvidia-settings
        state: present
        allowerasing: true

    - name: Install tuned for power management (Fedora 41+ default)
      ansible.builtin.dnf:
        name: tuned
        state: present

    - name: Enable and start tuned service
      ansible.builtin.systemd:
        name: tuned.service
        enabled: true
        state: started

    - name: Set performance profile for gaming/AI workloads
      ansible.builtin.command: tuned-adm profile accelerator-performance
      register: tuned_profile_result
      changed_when: false
      failed_when: false

    - name: Alternative - Set performance profile (if accelerator-performance not available)
      ansible.builtin.command: tuned-adm profile high-performance
      register: tuned_profile_alt_result
      changed_when: false
      failed_when: false
      when: tuned_profile_result.rc != 0

    - name: Run sensors-detect automatically
      ansible.builtin.command: sensors-detect --auto
      register: sensors_detect_result
      changed_when: false
      failed_when: false

    - name: Set CapsLock as Ctrl for GNOME user
      ansible.builtin.command:
        cmd: gsettings set org.gnome.desktop.input-sources xkb-options "['ctrl:nocaps']"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['user_uid'] }}/bus"
      changed_when: true

