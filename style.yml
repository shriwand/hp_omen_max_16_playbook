---
- name: Configure HP Omen Max 16 on Fedora
  hosts: omen
  become: true
  gather_facts: true

  vars:
    target_user: "{{ ansible_user_id }}"
    intel_wifi_pci_addr: "0000:03:00.0"
    intel_wifi_vendor: "0x8086"
    intel_wifi_device: "0x272b"

  tasks:
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true

    - name: Install base packages
      ansible.builtin.dnf:
        name:
          - dnf-plugins-core
          - wget
          - curl
          - git
          - neovim
          - htop
          - pciutils
          - usbutils
          - gcc
          - gcc-c++
          - make
          - cmake
          - kernel-headers
          - kernel-devel
          - dkms
          - python3-pip
          - python3-virtualenv
          - uv
          - podman
          - podman-docker
        state: present

    - name: Check whether RPM Fusion free repo is already installed
      ansible.builtin.command: rpm -q rpmfusion-free-release
      register: rpmfusion_free_check
      changed_when: false
      failed_when: false

    - name: Bootstrap RPM Fusion free and nonfree with nogpgcheck
      ansible.builtin.command: >
        dnf install -y --nogpgcheck
        https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
        https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
      args:
        executable: /bin/bash
      when: rpmfusion_free_check.rc != 0

    - name: Refresh metadata after enabling RPM Fusion
      ansible.builtin.dnf:
        update_cache: true

    - name: Install NVIDIA open driver stack
      ansible.builtin.dnf:
        name:
          - akmod-nvidia-open
          - xorg-x11-drv-nvidia
          - xorg-x11-drv-nvidia-cuda
          - nvidia-settings
        state: present
        allowerasing: true

    - name: Install tuned for power management (Fedora 41+ default)
      ansible.builtin.dnf:
        name: tuned
        state: present

    - name: Enable and start tuned service
      ansible.builtin.systemd:
        name: tuned.service
        enabled: true
        state: started

    - name: Set performance profile for gaming/AI workloads
      ansible.builtin.command: tuned-adm profile accelerator-performance
      register: tuned_profile_result
      changed_when: false
      failed_when: false

    - name: Alternative - Set performance profile (if accelerator-performance not available)
      ansible.builtin.command: tuned-adm profile high-performance
      register: tuned_profile_alt_result
      changed_when: false
      failed_when: false
      when: tuned_profile_result.rc != 0

    - name: Run sensors-detect automatically
      ansible.builtin.command: sensors-detect --auto
      register: sensors_detect_result
      changed_when: false
      failed_when: false

    - name: Set CapsLock as Ctrl for GNOME user
      ansible.builtin.command:
        cmd: gsettings set org.gnome.desktop.input-sources xkb-options "['ctrl:nocaps']"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['user_uid'] }}/bus"
      changed_when: true

    - name: Fix brightness control for Hybrid/Nvidia mode (WMI method)
      command: grubby --update-kernel=ALL --args="acpi_backlight=nvidia_wmi_ec"
      register: grubby_result
      changed_when: "'acpi_backlight=nvidia_wmi_ec' not in grubby_result.stdout"

    - name: Install udev rule to disable D3cold for Intel Wi-Fi
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/80-disable-wifi-d3cold.rules
        owner: root
        group: root
        mode: '0644'
        content: |
          ACTION=="add", SUBSYSTEM=="pci", KERNELS=="{{ intel_wifi_pci_addr }}", ATTR{vendor}=="{{ intel_wifi_vendor }}", ATTR{device}=="{{ intel_wifi_device }}", ATTR{d3cold_allowed}="0"

    - name: Install system-sleep hook to re-apply D3cold setting after resume
      ansible.builtin.copy:
        dest: /etc/systemd/system-sleep/disable-wifi-d3cold.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/sh
          dev="/sys/bus/pci/devices/{{ intel_wifi_pci_addr }}/d3cold_allowed"

          case "$1" in
            post)
              [ -w "$dev" ] && echo 0 > "$dev"
              ;;
          esac

          exit 0

    - name: Install oneshot service to disable D3cold on boot
      ansible.builtin.copy:
        dest: /etc/systemd/system/disable-wifi-d3cold.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Disable D3cold for Intel Wi-Fi
          After=systemd-udevd.service
          ConditionPathExists=/sys/bus/pci/devices/{{ intel_wifi_pci_addr }}/d3cold_allowed

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'echo 0 > /sys/bus/pci/devices/{{ intel_wifi_pci_addr }}/d3cold_allowed'

          [Install]
          WantedBy=multi-user.target

    - name: Reload udev rules
      ansible.builtin.command: udevadm control --reload
      changed_when: false

    - name: Reload systemd and enable boot workaround
      ansible.builtin.systemd:
        name: disable-wifi-d3cold.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Read current d3cold_allowed value
      ansible.builtin.command: cat /sys/bus/pci/devices/{{ intel_wifi_pci_addr }}/d3cold_allowed
      register: wifi_d3cold_allowed
      changed_when: false

    - name: Show current d3cold_allowed value
      ansible.builtin.debug:
        msg: "d3cold_allowed={{ wifi_d3cold_allowed.stdout }}"      
      
